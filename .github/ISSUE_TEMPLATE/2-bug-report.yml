name: 🐛 Bug report
description: Report something that doesn't work in Modrinth Enhanced
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If the official Modrinth App has the same problem, please report it
        [upstream](https://github.com/modrinth/code/issues/new/choose) instead.

  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched the [existing issues](https://github.com/Felitendo/Modrinth-Enhanced/issues?q=is%3Aissue) and this hasn't been reported yet
          required: true
        - label: I'm using the [latest release](https://github.com/Felitendo/Modrinth-Enhanced/releases/latest)
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings, bottom left.
      placeholder: 0.21.9
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - AppImage
        - Windows installer
        - macOS disk image
        - Debian or Ubuntu package
        - Fedora package
        - Arch Linux (modrinth-enhanced-bin)
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Accounts (offline, Ely.by, custom servers)
        - Skins
        - Instances, launching or logs
        - Sidebar, title bar or window
        - Updates or installation
        - Something else
    validations:
      required: true

  - type: dropdown
    id: upstream
    attributes:
      label: Does it happen in the official Modrinth App too?
      options:
        - No, only in Modrinth Enhanced
        - Yes, in the official app too
        - Not tested
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen? Screenshots help.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Launcher log
      description: |
        The newest file in the `launcher_logs` folder:
        - Windows: `%APPDATA%\ModrinthApp`
        - macOS: `~/Library/Application Support/ModrinthApp`
        - Linux: `~/.local/share/ModrinthApp`

        Remove anything private before posting.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: For example the account server or the instance it happens with.
    validations:
      required: false
